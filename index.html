<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <title>AhmedNasserHK QR CODE SCANNER</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: linear-gradient(145deg, #0a0c15 0%, #03050a 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Segoe UI', system-ui, -apple-system, BlinkMacSystemFont, 'Roboto', sans-serif;
      padding: 16px;
      position: relative;
    }

    /* animated background effect */
    body::before {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: radial-gradient(circle at 20% 30%, rgba(0, 255, 255, 0.03) 0%, transparent 50%);
      pointer-events: none;
    }

    /* main glass container */
    .scanner-container {
      max-width: 550px;
      width: 100%;
      background: rgba(10, 14, 23, 0.85);
      backdrop-filter: blur(20px);
      border-radius: 48px;
      border: 1px solid rgba(0, 255, 255, 0.2);
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5), 0 0 0 0.5px rgba(0, 255, 255, 0.1);
      overflow: hidden;
      transition: transform 0.3s ease;
    }

    /* header section */
    .header {
      padding: 24px 24px 16px;
      text-align: center;
      border-bottom: 1px solid rgba(0, 255, 255, 0.15);
    }

    .logo {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .lang-btn {
      background: rgba(0, 255, 255, 0.1);
      border: 1px solid rgba(0, 255, 255, 0.3);
      padding: 8px 18px;
      border-radius: 40px;
      font-size: 0.8rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
      color: #00ffff;
      backdrop-filter: blur(4px);
    }

    .lang-btn:hover {
      background: rgba(0, 255, 255, 0.2);
      transform: scale(0.98);
    }

    h1 {
      font-size: 1.8rem;
      font-weight: 700;
      background: linear-gradient(135deg, #00ffff, #0088ff);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      letter-spacing: -0.5px;
      margin: 8px 0;
    }

    .subtitle {
      font-size: 0.75rem;
      color: #88aaff;
      opacity: 0.8;
      letter-spacing: 1px;
    }

    /* camera area */
    .camera-area {
      padding: 20px 20px 12px;
    }

    .reader-wrapper {
      background: #00000033;
      border-radius: 32px;
      padding: 8px;
      border: 1px solid rgba(0, 255, 255, 0.25);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
    }

    #reader {
      width: 100%;
      border-radius: 24px;
      overflow: hidden;
      min-height: 320px;
    }

    #reader video {
      border-radius: 24px !important;
      width: 100% !important;
      object-fit: cover !important;
    }

    #reader__scan_region {
      background: transparent !important;
    }

    /* result panel */
    .result-panel {
      margin: 0 20px 20px;
      background: rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(12px);
      border-radius: 24px;
      padding: 16px 20px;
      border: 1px solid rgba(0, 255, 255, 0.25);
      transition: all 0.3s ease;
    }

    .result-panel.hidden {
      display: none;
    }

    .result-title {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: #00ffff;
      margin-bottom: 10px;
      font-weight: 600;
    }

    .result-content {
      font-family: 'SF Mono', 'Fira Code', monospace;
      font-size: 0.85rem;
      word-break: break-all;
      color: #e0e0ff;
      background: rgba(0, 0, 0, 0.4);
      padding: 12px 16px;
      border-radius: 18px;
      border-left: 3px solid #00ffff;
      line-height: 1.4;
    }

    /* buttons row */
    .buttons-row {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 12px;
      padding: 0 20px 24px;
    }

    .btn {
      background: rgba(20, 28, 40, 0.9);
      border: 1px solid rgba(0, 255, 255, 0.4);
      padding: 10px 22px;
      border-radius: 40px;
      font-size: 0.85rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: #ccddff;
      backdrop-filter: blur(4px);
    }

    .btn:hover {
      background: rgba(0, 255, 255, 0.15);
      border-color: #00ffff;
      transform: translateY(-1px);
    }

    .btn:active {
      transform: scale(0.96);
    }

    .btn-chrome {
      border-color: #ffaa33;
    }

    .btn-chrome:hover {
      background: rgba(255, 170, 51, 0.2);
      border-color: #ffaa33;
    }

    /* footer */
    .footer {
      text-align: center;
      padding: 20px 20px 24px;
      font-size: 0.7rem;
      color: #6688aa;
      border-top: 1px solid rgba(0, 255, 255, 0.1);
    }

    .footer a {
      color: #00ccff;
      text-decoration: none;
    }

    /* icons using pseudo-elements */
    .icon {
      font-style: normal;
      font-weight: 600;
    }

    /* rtl/ltr adjustments */
    body[dir="ltr"] .result-content {
      border-left: 3px solid #00ffff;
      border-right: none;
      text-align: left;
    }

    body[dir="rtl"] .result-content {
      border-right: 3px solid #00ffff;
      border-left: none;
      text-align: right;
    }

    /* responsive */
    @media (max-width: 550px) {
      .scanner-container {
        border-radius: 32px;
      }
      .btn {
        padding: 8px 16px;
        font-size: 0.75rem;
      }
      h1 {
        font-size: 1.4rem;
      }
      .result-content {
        font-size: 0.75rem;
      }
    }
  </style>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
</head>
<body>
<div class="scanner-container">
  <div class="header">
    <div class="logo">
      <div></div>
      <button class="lang-btn" id="langToggleBtn">🇬🇧 English</button>
    </div>
    <h1 id="mainTitle">AhmedNasserHK QR</h1>
    <div class="subtitle" id="subtitleText">مسح فوري · آمن · بدون حفظ بيانات</div>
  </div>

  <div class="camera-area">
    <div class="reader-wrapper">
      <div id="reader"></div>
    </div>
  </div>

  <div id="resultPanel" class="result-panel hidden">
    <div class="result-title" id="resultLabel">📷 النتيجة الممسوحة</div>
    <div class="result-content" id="result">—</div>
  </div>

  <div class="buttons-row">
    <button class="btn" id="reloadBtn">⟳ <span id="reloadText">إعادة الكاميرا</span></button>
    <button class="btn btn-chrome" id="chromeBtn">🌐 <span id="chromeText">فتح في كروم</span></button>
  </div>

  <div class="footer">
    <span id="footerText">AhmedNasserHK QR CODE SCANNER • Powered by <a href="http://www.hk4tech.com">HK Projects</a></span>
  </div>
</div>

<canvas style="display:none;" id="qr-canvas" width="800" height="600"></canvas>
<script src="./qrScript.js"></script>
<script>
  (function() {
    // ============================================================
    // LOGIC ORIGINAL - لم يتم التعديل في منطق المسح أو التحويل
    // فقط إضافة الترجمة والتصميم العصري
    // ============================================================
    
    const hotspotURL = "http://10.0.0.1/login";
    let html5Qrcode = null;
    let redirectPending = false;
    
    // الترجمة العربية والإنجليزية
    const translations = {
      ar: {
        title: "AhmedNasserHK QR",
        subtitle: "مسح فوري · آمن · بدون حفظ بيانات",
        resultLabel: "📷 النتيجة الممسوحة",
        reloadBtn: "⟳ إعادة الكاميرا",
        chromeBtn: "🌐 فتح في كروم",
        footer: "AhmedNasserHK QR CODE SCANNER • Powered by HK Projects",
        langBtn: "🇬🇧 English",
        cameraError: "⚠️ خطأ في الكاميرا - تأكد من الإذن",
        defaultResult: "—"
      },
      en: {
        title: "AhmedNasserHK QR",
        subtitle: "Instant Scan · Secure · No Data Storage",
        resultLabel: "📷 Scanned Result",
        reloadBtn: "⟳ Reload Camera",
        chromeBtn: "🌐 Open in Chrome",
        footer: "AhmedNasserHK QR CODE SCANNER • Powered by HK Projects",
        langBtn: "🇸🇦 العربية",
        cameraError: "⚠️ Camera Error - Please allow permission",
        defaultResult: "—"
      }
    };
    
    let currentLang = "ar";
    
    // عناصر DOM
    const mainTitle = document.getElementById("mainTitle");
    const subtitleText = document.getElementById("subtitleText");
    const resultLabel = document.getElementById("resultLabel");
    const reloadText = document.getElementById("reloadText");
    const chromeText = document.getElementById("chromeText");
    const footerText = document.getElementById("footerText");
    const langToggleBtn = document.getElementById("langToggleBtn");
    const resultPanel = document.getElementById("resultPanel");
    const resultDisplay = document.getElementById("result");
    const reloadBtn = document.getElementById("reloadBtn");
    const chromeBtn = document.getElementById("chromeBtn");
    
    // تطبيق اللغة
    function applyLanguage(lang) {
      const t = translations[lang];
      if (!t) return;
      mainTitle.innerText = t.title;
      subtitleText.innerText = t.subtitle;
      resultLabel.innerText = t.resultLabel;
      reloadText.innerText = t.reloadBtn.replace("⟳ ", "");
      chromeText.innerText = t.chromeBtn.replace("🌐 ", "");
      footerText.innerHTML = t.footer;
      langToggleBtn.innerText = t.langBtn;
      
      if (lang === "ar") {
        document.documentElement.setAttribute("dir", "rtl");
        document.documentElement.setAttribute("lang", "ar");
        document.body.style.direction = "rtl";
      } else {
        document.documentElement.setAttribute("dir", "ltr");
        document.documentElement.setAttribute("lang", "en");
        document.body.style.direction = "ltr";
      }
      
      // إذا كان النص الحالي هو القيمة الافتراضية أو رسالة خطأ نقوم بتحديثه
      if (resultDisplay.innerText === "—" || resultDisplay.innerText === translations.ar.defaultResult || resultDisplay.innerText === translations.en.defaultResult) {
        resultDisplay.innerText = t.defaultResult;
      }
    }
    
    // حفظ اللغة في localStorage
    function setLanguage(lang) {
      currentLang = lang;
      applyLanguage(currentLang);
      localStorage.setItem("qr_scanner_lang", currentLang);
    }
    
    function toggleLanguage() {
      const newLang = currentLang === "ar" ? "en" : "ar";
      setLanguage(newLang);
    }
    
    // استرجاع اللغة المحفوظة
    const savedLang = localStorage.getItem("qr_scanner_lang");
    if (savedLang && (savedLang === "ar" || savedLang === "en")) {
      currentLang = savedLang;
    } else {
      currentLang = "ar";
    }
    applyLanguage(currentLang);
    
    // ============================================================
    // ORIGINAL QR LOGIC - لم يتغير أي شيء في المنطق الأساسي
    // ============================================================
    
    const qrCodeSuccessCallback = (decodedText, decodedResult) => {
      if(redirectPending) return;
      if(decodedText && decodedText.trim() !== ""){
        redirectPending = true;
        resultPanel.classList.remove("hidden");
        resultDisplay.textContent = decodedText;
        
        if(html5Qrcode && typeof html5Qrcode.stop === 'function'){
          html5Qrcode.stop().catch(e => console.warn(e));
        }
        
        let destination = decodedText.trim();
        if(!destination.startsWith("http://") && !destination.startsWith("https://")){
          if(destination.match(/^[a-zA-Z0-9\-\.]+\.[a-zA-Z]{2,}([\/\?\&].*)?$/)){
            destination = "http://" + destination;
          } else {
            destination = hotspotURL + "?username=" + encodeURIComponent(decodedText);
          }
        }
        
        setTimeout(() => {
          window.location.href = destination;
        }, 30);
      }
    };
    
    const config = {fps:10, qrbox:{width:250, height:250}};
    
    function initScanner(){
      if(typeof Html5Qrcode === 'undefined'){
        setTimeout(initScanner, 200);
        return;
      }
      html5Qrcode = new Html5Qrcode('reader');
      html5Qrcode.start({facingMode:"environment"}, config, qrCodeSuccessCallback)
        .catch(err => {
          html5Qrcode.start({facingMode:"user"}, config, qrCodeSuccessCallback)
            .catch(err2 => {
              const errorMsg = currentLang === "ar" ? "⚠️ خطأ في الكاميرا - تأكد من الإذن" : "⚠️ Camera Error - Please allow permission";
              resultDisplay.innerHTML = errorMsg;
              resultPanel.classList.remove("hidden");
            });
        });
    }
    
    // إعادة تشغيل الكاميرا (نفس المنطق الأصلي مع إعادة تعيين الـ redirectPending)
    function reloadCamera() {
      redirectPending = false;
      if (html5Qrcode) {
        try {
          if (typeof html5Qrcode.stop === 'function') {
            html5Qrcode.stop().catch(e => console.warn(e));
          }
        } catch(e) {}
      }
      resultPanel.classList.add("hidden");
      resultDisplay.textContent = translations[currentLang].defaultResult;
      setTimeout(() => {
        if (html5Qrcode) {
          try {
            html5Qrcode.clear();
          } catch(e) {}
        }
        initScanner();
      }, 100);
    }
    
    // فتح في كروم (نفس المنطق الأصلي)
    function openInChrome() {
      const currentPageUrl = window.location.href;
      const ua = navigator.userAgent.toLowerCase();
      const isAndroid = ua.includes("android");
      const isIOS = /iphone|ipad|ipod/.test(ua);
      
      if (isAndroid) {
        const intentUrl = `intent://${window.location.host}${window.location.pathname}${window.location.search}#Intent;scheme=http;package=com.android.chrome;end`;
        window.location.href = intentUrl;
        setTimeout(() => {
          if (document.hasFocus()) {
            window.location.href = currentPageUrl;
          }
        }, 350);
      } else if (isIOS) {
        const chromeSchemeUrl = `googlechrome://${window.location.host}${window.location.pathname}${window.location.search}`;
        window.location.href = chromeSchemeUrl;
        setTimeout(() => {
          const msg = currentLang === "ar" ? "قد لا يكون متصفح كروم مثبتًا" : "Chrome browser might not be installed";
          alert(msg);
        }, 300);
      } else {
        window.location.href = currentPageUrl;
      }
    }
    
    // ربط الأحداث
    langToggleBtn.addEventListener("click", (e) => {
      e.preventDefault();
      toggleLanguage();
    });
    
    reloadBtn.addEventListener("click", (e) => {
      e.preventDefault();
      reloadCamera();
    });
    
    chromeBtn.addEventListener("click", (e) => {
      e.preventDefault();
      if (html5Qrcode) {
        try {
          if (typeof html5Qrcode.stop === 'function') {
            html5Qrcode.stop().catch(e => console.log);
          }
        } catch(e) {}
      }
      openInChrome();
    });
    
    // بدء المسح عند تحميل الصفحة
    if(document.readyState === 'loading'){
      document.addEventListener('DOMContentLoaded', initScanner);
    } else {
      initScanner();
    }
    
  })();
</script>
</body>
</html>
