<!DOCTYPE html>
<html>
<head>
  
<meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
<title>AhmedNasserHK QR CODE SCANNER</title>
  <style>
    body{
      background-color: #000000;
      color :#ffffff;
    }
    video {
      width: 100%    !important;
      height: auto   !important;
    }
    .btn{
      margin-top:5px;
      margin-bottom:10px;
      padding:5px;
      background-color: #f2f2f2;
      color: #000000;
      border-radius:3px;
      width: 150px;
      cursor: pointer;
    }
    .camera{
      width: 95%;
    }
    a{
      text-decoration: none;
      color:#20a8d8;
    }
    @font-face {
      font-family: 'fontello';
      src: url('./font/fontello.eot?14907215');
      src: url('./font/fontello.eot?14907215#iefix') format('embedded-opentype'),
           url('./font/fontello.woff?14907215') format('woff'),
           url('./font/fontello.ttf?14907215') format('truetype'),
           url('./font/fontello.svg?14907215#fontello') format('svg');
      font-weight: normal;
      font-style: normal;
    }
    .icon
    {
      font-family: "fontello";
      font-style: normal;
      font-weight: normal;
      speak: none;
      display: inline-block;
      text-decoration: inherit;
      width: 1em;
      margin-right: .2em;
      text-align: center;
      font-variant: normal;
      text-transform: none;
      line-height: 1em;
      margin-left: .2em;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
  </style>

</head>

<body>
  <center>
    <div id="main">
      <div id="mainbody">
        <div class="camera" id="outdiv"></div>
        <div style="display: table;">
          <div style="display: table-row;">
            <div style="display: table-cell; padding:3px;">
              <div class="btn" id="reload" onclick="location.reload();"><i class="icon icon-arrows-cw">&#xe800;</i> Reload Camera</div>
            </div>
            <div style="display: table-cell; padding:3px;">
              <a class="btn" href="intent://ahmednasserhk.github.io/HK4tech-QR-Scanner/#Intent;scheme=http;package=com.android.chrome;end"><i class="icon icon-chrome-1">&#xf268;</i> Open in Chrome</a>
            </div>
          </div>
        </div>
      </div>
    </div>
    <div>AhmedNasserHK QR CODE SCANNER <br>Powered by <a href="http://www.hk4tech.com">HK Projects</a></div>
	
  </center>
<canvas style="display:none;" id="qr-canvas" width="800" height="600"></canvas>
    <script src="./qrScript.js"></script>
    <div style="text-align: center;">
        <div id="reader" style="width: 500px;"></div>
        <div id="show" style="display: none;">
            <h4>Scanned Result</h4>
            <p style="color: blue;" id="result"></p>
    </div>
		
    <script>
        const hotspotURL = "http://10.0.0.1/login";
        let html5Qrcode = null;
        let redirectPending = false;

        const qrCodeSuccessCallback = (decodedText, decodedResult) => {
            if(redirectPending) return;
            if(decodedText && decodedText.trim() !== ""){
                redirectPending = true;
                document.getElementById('show').style.display = 'block';
                document.getElementById('result').textContent = decodedText;
                
                if(html5Qrcode && typeof html5Qrcode.stop === 'function'){
                    html5Qrcode.stop().catch(e => console.warn(e));
                }
                
                let destination = decodedText.trim();
                if(!destination.startsWith("http://") && !destination.startsWith("https://")){
                    if(destination.match(/^[a-zA-Z0-9\-\.]+\.[a-zA-Z]{2,}([\/\?\&].*)?$/)){
                        destination = "http://" + destination;
                    } else {
                        destination = hotspotURL + "?username=" + encodeURIComponent(decodedText);
                    }
                }
                
                setTimeout(() => {
                    window.location.href = destination;
                }, 30);
            }
        };
        
        const config = {fps:10, qrbox:{width:250, height:250}};
        
        function initScanner(){
            if(typeof Html5Qrcode === 'undefined'){
                setTimeout(initScanner, 200);
                return;
            }
            html5Qrcode = new Html5Qrcode('reader');
            html5Qrcode.start({facingMode:"environment"}, config, qrCodeSuccessCallback)
                .catch(err => {
                    html5Qrcode.start({facingMode:"user"}, config, qrCodeSuccessCallback)
                        .catch(err2 => {
                            document.getElementById('result').innerHTML = "Camera error";
                            document.getElementById('show').style.display = 'block';
                        });
                });
        }
        
        if(document.readyState === 'loading'){
            document.addEventListener('DOMContentLoaded', initScanner);
        } else {
            initScanner();
        }
    </script>
</body>
</html>
